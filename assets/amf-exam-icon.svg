<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2C4F"/>
      <stop offset="100%" stop-color="#101A30"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C79A52"/>
      <stop offset="100%" stop-color="#8F6B31"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- faint ruled lines, evoking a document / exam sheet -->
  <g stroke="#2A3B60" stroke-width="3" opacity="0.55">
    <line x1="96" y1="128" x2="196" y2="128"/>
    <line x1="96" y1="160" x2="176" y2="160"/>
    <line x1="316" y1="352" x2="416" y2="352"/>
    <line x1="336" y1="384" x2="416" y2="384"/>
  </g>

  <!-- seal rays -->
  <g stroke="url(#gold)" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="108" x2="256" y2="132"/>
    <line x1="256" y1="380" x2="256" y2="404"/>
    <line x1="108" y1="256" x2="132" y2="256"/>
    <line x1="380" y1="256" x2="404" y2="256"/>
    <line x1="149" y1="149" x2="166" y2="166"/>
    <line x1="346" y1="346" x2="363" y2="363"/>
    <line x1="149" y1="363" x2="166" y2="346"/>
    <line x1="346" y1="166" x2="363" y2="149"/>
  </g>

  <!-- outer seal ring (double border) -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="url(#gold)" stroke-width="9"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="url(#gold)" stroke-width="4"/>

  <!-- inner disc -->
  <circle cx="256" cy="256" r="104" fill="#16233F"/>

  <!-- checkmark -->
  <path d="M198 262 L238 302 L322 210" fill="none" stroke="url(#gold)" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
