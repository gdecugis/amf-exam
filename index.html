<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen AMF - Entraînement Standalone</title>
  <link rel="icon" type="image/svg+xml" href="/assets/amf-exam-icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/amf-exam-icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/amf-exam-icon-512.png">
  <link rel="apple-touch-icon" href="/assets/amf-exam-icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#16233F">
  <!-- Load React, ReactDOM, Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script>
    window.process = { env: { NODE_ENV: 'development' } };
  </script>

  <script type="text/babel">
    // Expose React hooks globally
    window.useState = React.useState;
    window.useEffect = React.useEffect;
    window.useRef = React.useRef;
    window.useMemo = React.useMemo;

    // Plain inline SVG icons (no external library). Lucide's DOM-mutating
    // createIcons() swapped these <i> nodes for <svg> nodes outside React's
    // control — when React later tried to reconcile/remove a node it no
    // longer actually owned, it threw "Failed to execute 'removeChild' on
    // 'Node'". Rendering real SVG elements directly keeps the whole tree
    // React-owned, so there's nothing left to race with.
    const iconProps = (style) => ({
      viewBox: "0 0 24 24",
      fill: "none",
      stroke: "currentColor",
      strokeWidth: "2",
      strokeLinecap: "round",
      strokeLinejoin: "round",
      style,
    });

    window.CheckCircle2 = ({ className, style }) => (
      <svg className={className} {...iconProps(style)}>
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <polyline points="22 4 12 14.01 9 11.01" />
      </svg>
    );
    window.XCircle = ({ className, style }) => (
      <svg className={className} {...iconProps(style)}>
        <circle cx="12" cy="12" r="10" />
        <line x1="15" y1="9" x2="9" y2="15" />
        <line x1="9" y1="9" x2="15" y2="15" />
      </svg>
    );
    window.Clock = ({ className, style }) => (
      <svg className={className} {...iconProps(style)}>
        <circle cx="12" cy="12" r="10" />
        <polyline points="12 6 12 12 16 14" />
      </svg>
    );
    window.LayoutGrid = ({ className, style }) => (
      <svg className={className} {...iconProps(style)}>
        <rect x="3" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="14" width="7" height="7" rx="1" />
        <rect x="3" y="14" width="7" height="7" rx="1" />
      </svg>
    );
    window.ChevronLeft = ({ className, style }) => (
      <svg className={className} {...iconProps(style)}>
        <polyline points="15 18 9 12 15 6" />
      </svg>
    );
    window.ChevronRight = ({ className, style }) => (
      <svg className={className} {...iconProps(style)}>
        <polyline points="9 18 15 12 9 6" />
      </svg>
    );
    window.Loader2 = ({ className, style }) => (
      <svg className={className} {...iconProps(style)}>
        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
      </svg>
    );
    window.X = ({ className, style }) => (
      <svg className={className} {...iconProps(style)}>
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    );
  </script>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="auth.js"></script>

  <script type="text/babel" src="examen-amf.jsx"></script>

  <script type="text/babel">
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<ErrorBoundary><AMFExam /></ErrorBoundary>);
  </script>
</body>
</html>
